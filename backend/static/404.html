<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found — Hindsight</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f8f5ef'/%3E%3Ccircle cx='32' cy='32' r='21' fill='none' stroke='%23e0d8c8' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%237a3f00'/%3E%3C/svg%3E" />
<style>
:root{--background:hsl(40 33% 96%);--foreground:hsl(0 0% 10%);--muted-fg:hsl(0 0% 34%);--accent:hsl(24 88% 42%);--border:hsl(38 14% 84%);
  --serif:"Fraunces",ui-serif,Georgia,serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--background:hsl(30 12% 9%);--foreground:hsl(40 25% 93%);--muted-fg:hsl(35 10% 64%);--accent:hsl(32 95% 58%);--border:hsl(30 10% 22%)}}
:root[data-theme="dark"]{--background:hsl(30 12% 9%);--foreground:hsl(40 25% 93%);--muted-fg:hsl(35 10% 64%);--accent:hsl(32 95% 58%);--border:hsl(30 10% 22%)}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;display:flex;flex-direction:column;background:var(--background);color:var(--foreground);font-family:var(--mono);line-height:1.65;overflow-x:hidden}
header{padding:2rem 1.5rem}
.logo{display:inline-flex;align-items:center;gap:.75rem;color:inherit;text-decoration:none;font-family:var(--serif);font-size:1.25rem;letter-spacing:-.01em}
.logo i{height:.625rem;width:.625rem;border-radius:9999px;background:var(--accent)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:2rem 1.5rem 6rem;max-width:44rem;width:100%;margin:0 auto}
.code{font-size:11px;text-transform:uppercase;letter-spacing:.22em;color:var(--muted-fg);margin:0 0 1.25rem}
h1{font-family:var(--serif);font-weight:300;font-size:clamp(2.5rem,8vw,4.5rem);line-height:1.04;letter-spacing:-.01em;margin:0}
p.sub{margin:1.5rem 0 2.5rem;color:var(--muted-fg);font-size:15px;max-width:32rem}
a.btn{align-self:flex-start;font-size:12px;text-transform:uppercase;letter-spacing:.14em;padding:.75rem 1.75rem;background:var(--foreground);color:var(--background);text-decoration:none;transition:background .3s}
a.btn:hover,a.btn:focus-visible{background:var(--accent)}
@media(min-width:768px){header{padding:2rem 4rem}main{padding-left:0;padding-right:0}}
</style>
<script>try{var t=localStorage.getItem("hindsight_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body>
<header><a class="logo" href="/"><i></i>hindsight</a></header>
<main>
  <p class="code">Error 404</p>
  <h1>This page doesn't exist.</h1>
  <p class="sub">The address may be mistyped, or the page may have moved. Your recent checks are safe.</p>
  <a class="btn" href="/">Back to Hindsight</a>
</main>
</body>
</html>
